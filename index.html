<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MENEMENTALE</title>
    <link rel="icon" href="images/favicon.png" />

    <style>
      @font-face{
        font-family: "Determination";
        src: url("fonts/determination.ttf") format("truetype");
        font-display: swap;
      }
      body{
        margin: 0;
        background: black;
        color: white;
        font-family: Determination, monospace;
      }
      /* keep the SILVATALE “center everything” vibe */
      .wrap{
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 10px 30px;
        gap: 10px;
      }
      img{ image-rendering: pixelated; }
      .nav img{ height: 42px; }
      .row{ display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      .spacer{ height: 8px; }
      iframe{
        width: min(600px, 92vw);
        height: calc(min(600px, 92vw) * 0.5667); /* 16:9 */
        border: 0;
      }
      .tiny{
        font-size: 14px;
        opacity: 0.85;
        text-align: center;
        max-width: 600px;
        line-height: 1.3;
      }
      a:focus-visible{ outline: 2px solid #fff; outline-offset: 3px; }
    </style>
  </head>

  <body>
    <div class="wrap">
      <!-- Header logo -->
      <img src="images/menementale_offset.png" alt="MENEMENTALE" />

      <!-- Nav buttons (image-based like SILVATALE) -->
      <div class="row nav">
        <a href="about.html"><img src="images/about.png" alt="About" /></a>
        <a href="mod.html"><img src="images/mod.png" alt="Mod" /></a>
        <a href="albums.html"><img src="images/album.png" alt="Albums" /></a>
        <a href="contact.html"><img src="images/contact.png" alt="Contact" /></a>
      </div>

      <!-- Big download button -->
      <a href="MENEMENTALE.zip" download>
        <img src="images/availablenow.png" alt="Available Now - Download" />
      </a>

      <div class="spacer"></div>

      <!-- YouTube embed -->
      <iframe
        src="https://www.youtube.com/embed/REPLACE_WITH_VIDEO_ID"
        title="MENEMENTALE Trailer"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>

      <div class="spacer"></div>

      <!-- Installation button -->
      <a href="install.html"><img src="images/installation.png" alt="Installation" /></a>

      <div class="spacer"></div>

      <!-- Social buttons -->
      <div class="row">
        <a href="https://x.com/REPLACE" target="_blank" rel="noopener">
          <img src="images/twitter.png" alt="Twitter / X" />
        </a>
        <a href="https://www.youtube.com/@REPLACE" target="_blank" rel="noopener">
          <img src="images/youtube.png" alt="YouTube" />
        </a>
        <a href="https://bsky.app/profile/REPLACE" target="_blank" rel="noopener">
          <img src="images/bluesky.png" alt="Bluesky" />
        </a>
      </div>

      <!-- Optional: tiny text (uses determination.ttf) -->
      <div class="tiny">
        Fan project. Not affiliated with UNDERTALE. This site is styled after a simple
        image-button layout like your reference. 
      </div>
    </div>
  </body>
</html>
